[workspace]
members = ["libraries/*", "programs/*"]
resolver = "2"

[workspace.metadata.cli]
solana = "4.0.0"

[workspace.metadata.solana]
tools-version = "v1.55"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

